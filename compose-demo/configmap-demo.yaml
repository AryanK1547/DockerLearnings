apiVersion: apps/v1
kind: Deployment
metadata:
  name: configmap-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: configmap-demo

  template:
    metadata:
      labels:
        app: configmap-demo

    spec:
      containers:
        - name: demo
          image: busybox:latest

          command:
            - sh
            - -c
            - |
              while true; do
                echo "APP_MODE=$APP_MODE"
                echo "APP_MESSAGE=$APP_MESSAGE"
                sleep 10
              done

          env:
            - name: APP_MODE
              valueFrom:
                configMapKeyRef:
                  name: nginx-config
                  key: APP_MODE

            - name: APP_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: nginx-config
                  key: APP_MESSAGE