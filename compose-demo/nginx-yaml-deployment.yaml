apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-yaml-deployment

spec:
  replicas: 3

  selector:
    matchLabels: 
      app: nginx-yaml

  template:
    metadata:
      labels:
        app: nginx-yaml

    spec:
      containers:
      - name: nginx-yaml-containers
        image: nginx:1.27

        ports:
              - containerPort: 80

        resources:
        
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "256Mi"  